name: OpaqueRelayPulse

on:
  repository_dispatch:
    types:
      - pulse
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opaque-relay-pulse-serial-lock
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Opaque Relay Shell
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Execute Opaque Pulse
        env:
          OPAQUE_SECRET: ${{ secrets.OPAQUE_RELAY_KEY }}
        run: |
          set +x
          if [ -n "$OPAQUE_SECRET" ]; then echo "::add-mask::${OPAQUE_SECRET}"; fi
          python3 -B src/OpaqueRelayRuntime.py >/dev/null 2>&1 || true
          echo "[OPAQUE-RELAY] status=completed"
